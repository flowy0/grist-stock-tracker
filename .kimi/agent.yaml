---
# Grist Stock Tracker - Developer Mode Agent Configuration
# Usage: kimi --agent-file .kimi/agent.yaml
#
# This agent is configured for full development work on the Grist Stock Tracker project.
# It includes all necessary tools for Python development, Podman/Docker management,
# Git workflows, and Grist integration.

version: 1
agent:
  name: grist-stock-tracker-dev
  
  # Inherit from default agent as base
  extend: default
  
  # System prompt for this project
  system_prompt_path: ./.kimi/system-prompt.md
  
  # Project-specific variables available in system prompt
  system_prompt_args:
    PROJECT_NAME: "Grist Stock Tracker"
    TECH_STACK: "Python, Grist, Podman, PostgreSQL"
    ARCHITECTURE: "Medallion (Bronze/Silver/Gold)"
    DEFAULT_BRANCH: "main"
    DEV_BRANCH: "dev"
    
  # Exclude tools not needed for this project
  exclude_tools:
    # Exclude media file reading - not needed for stock tracking
    - "kimi_cli.tools.file:ReadMediaFile"
    
    # Uncomment below to further restrict:
    # - "kimi_cli.tools.shell:Shell"           # Block all shell commands
    # - "kimi_cli.tools.web:SearchWeb"         # Block web search
    # - "kimi_cli.tools.web:FetchURL"          # Block URL fetching
    # - "kimi_cli.tools.multiagent:Task"       # Block subagent spawning

  # Subagents for specialized tasks
  subagents:
    # Code reviewer subagent - focused on Python code review
    reviewer:
      path: ./.kimi/subagents/reviewer.yaml
      description: "Python code review specialist"
    
    # Test writer subagent - focused on test generation
    tester:
      path: ./.kimi/subagents/tester.yaml
      description: "Python test generation specialist"
    
    # Git workflow subagent - handles branch/PR operations
    git:
      path: ./.kimi/subagents/git.yaml
      description: "Git workflow specialist for branch and PR management"

---
# Git Workflow Configuration
#
# This agent supports git operations including:
# - Branch creation and switching
# - Committing changes
# - Pushing to remote
# - Creating GitHub PRs (requires gh CLI or MCP)
#
# Git Workflow:
# 1. Create feature branch: git checkout -b feature/name
# 2. Make changes and commit: git add . && git commit -m "feat: ..."
# 3. Push: git push -u origin feature/name
# 4. Create PR: gh pr create --title "..." --body "..." --base dev
#
# PRs should target the 'dev' branch, not 'main' directly.
#
# SECURITY NOTE: File Access Restriction
# This agent is configured to only work within the project directory.
# The system prompt explicitly forbids accessing files outside ${KIMI_WORK_DIR}.
# User approval is required for all file write operations as an additional safeguard.
