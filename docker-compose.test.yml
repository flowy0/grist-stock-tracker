# Grist Stock Tracker - Test Environment Configuration
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d

version: '3.8'

services:
  grist:
    container_name: grist-stock-tracker-test
    ports:
      - "8485:8484"  # Different port for test environment
    volumes:
      - ./grist-data/test:/persist  # Separate test data directory
    environment:
      - GRIST_SINGLE_ORG=stock-tracker-test
      - GRIST_DEFAULT_EMAIL=admin-test@localhost
